<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운트다운 타이머</title>
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        
            /* 💡 스크롤 바 숨기기 기능 추가 */
            -ms-overflow-style: none; /* 인터넷 익스플로러, 엣지 */
            scrollbar-width: none;    /* 파이어폭스 */
        }
        
        /* 크롬, 사파리, 오페라, 브레이브 브라우저용 스크롤 바 숨기기 */
        body::-webkit-scrollbar {
            display: none;
        }


        /* 1. 첫 번째 섹션: 타이머, 제목, 시작 버튼 배치 (전체 화면) */
        .timer-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 높이를 100% 꽉 채움 */
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
            position: relative;
        }

        /* 타이머 위 큰 제목 스타일 */
        #title-display {
            font-size: 3rem; /* 기본값 */
            font-weight: bold;
            margin-bottom: 10px;
            color: #e0e0e0;
            word-break: break-all;
            max-width: 90vw;
            line-height: 1.2;
        }

        /* 타이머 숫자 스타일 */
        #timer {
            font-size: 12rem;
            font-weight: bold;
            transition: color 0.5s ease;
            line-height: 1;
            margin-bottom: 40px;
        }
        
        /* 💡 [수정후 추가] 두 버튼을 가로로 나란히 정렬하는 상자 */
        .btn-group {
            display: flex;
            gap: 15px;
        }
        
        /* 💡 [수정후 추가] 준비/시작 버튼의 공통 크기 및 폰트 스타일 */
        .nav-btn {
            padding: 16px 40px;
            font-size: 1.4rem;
            cursor: pointer;
            border-radius: 30px; /* 둥근 버튼 형태 */
            border: none;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .nav-btn:active {
            transform: translateY(1px); /* 클릭했을 때 살짝 들어가는 효과 */
        }
        
        /* 💡 [수정후 추가] 준비 버튼 전용 스타일 (오렌지색) */
        .ready-btn {
            background-color: #F39C12;
            color: white;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }
        .ready-btn:hover {
            background-color: #D35400;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }
        
        /* 💡 [수정후 변경] 시작 버튼 전용 스타일 (초록색 - 공통 스타일을 제외하고 색상만 남김) */
        .start-btn {
            background-color: #2ECC71;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        .start-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        /* 아래로 스크롤 하라는 힌트 문구 */
        .scroll-hint {
            position: absolute;
            bottom: 20px;
            color: #555;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* 2. 두 번째 섹션: 아래로 스크롤 해야 보이는 설정 영역 */
        .settings-screen {
            min-height: 50vh;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            gap: 25px;
            box-sizing: border-box;
        }

        /* 설정 박스 레이아웃 */
        .setting-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .setting-box label {
            font-size: 1rem;
            color: #aaa;
            font-weight: bold;
        }

        /* 입력창 및 슬라이더 스타일 */
        input[type="text"], input[type="number"] {
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #252525;
            color: #fff;
            outline: none;
        }

        /* 크기 조절 슬라이더(Range) 레이아웃 */
        .size-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        .size-value {
            font-size: 1.1rem;
            min-width: 50px;
            text-align: right;
        }

        /* 시간 입력 레이아웃 */
        .time-inputs {
            display: flex;
            gap: 10px;
        }
        .time-inputs input {
            width: 50%;
            text-align: center;
        }

        /* 상태별 색상 및 애니메이션 */
        .green { color: #2ECC71; }
        .yellow { color: #F1C40F; }
        .red-blink {
            color: #E74C3C;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <!-- [1번 세션] 메인 타이머 화면 (시작 버튼 포함) -->
    <div class="timer-screen">
        <div id="title-display">암송 페스티벌</div>
        <div id="timer" class="green">25:00</div>
        <!-- 💡 기존 시작 버튼 위치를 찾아서 아래처럼 감싸고 준비 버튼을 추가하세요 -->
            <div class="btn-group">
                <button class="nav-btn ready-btn" onclick="applySettings()">준비</button>
                <button class="nav-btn start-btn" onclick="startTimer()">시작</button>
            </div>

        
        <!-- 아래로 스크롤 하라는 힌트 문구 -->
        <div class="scroll-hint">▼ </div>
    </div>

    <!-- [2번 세션] 하단 설정 영역 (스크롤해서 내려야 보임) -->
    <div class="settings-screen">
        
        <!-- 제목 입력 -->
        <div class="setting-box">
            <label for="titleInput">타이머 제목</label>
            <input type="text" id="titleInput" placeholder="암송 페스티벌" oninput="updateTitle(this.value)">
        </div>

        <!-- 제목 글자 크기 지정 (슬라이더) -->
        <div class="setting-box">
            <label for="sizeInput">제목 글자 크기</label>
            <div class="size-control">
                <input type="range" id="sizeInput" min="1.5" max="10" step="0.1" value="7" oninput="updateFontSize(this.value)">
                <span class="size-value" id="sizeValue">7.0 rem</span>
            </div>
        </div>
        
        <!-- 시간 지정 -->
        <div class="setting-box">
            <label>시간 설정</label>
            <div class="time-inputs">
                <input type="number" id="minutesInput" placeholder="분" min="0" value="25" oninput="syncTimeDisplay()">
                <input type="number" id="secondsInput" placeholder="초" min="0" max="59" value="0" oninput="syncTimeDisplay()">

            </div>
        </div>

    </div>

    <script>
        let countdown;
        let timeLeft;

        // 실시간 제목 업데이트
        function updateTitle(text) {
            const titleDisplay = document.getElementById('title-display');
            if (text.trim() === "") {
                titleDisplay.textContent = "타이머 제목을 입력하세요";
            } else {
                titleDisplay.textContent = text;
            }
        }

        // 실시간 제목 크기 업데이트
        function updateFontSize(value) {
            document.getElementById('title-display').style.fontSize = `${value}rem`;
            document.getElementById('sizeValue').textContent = `${parseFloat(value).toFixed(1)} rem`;
        }
        // 💡 [준비] 버튼을 눌렀을 때 작동하는 강제 반영 및 화면 이동 함수
        function applySettings() {
            // 진행 중인 타이머가 있다면 정지
            clearInterval(countdown);
        
            // 하단 입력값들 가져오기
            const titleVal = document.getElementById('titleInput').value;
            const sizeVal = document.getElementById('sizeInput').value;
        
            // 상단 타이머 화면에 강제로 주입 (기존에 만들어둔 함수들을 재활용합니다)
            syncTitle(titleVal);
            syncFontSize(sizeVal);
            syncTimeDisplay();
        
            // 부드럽게 메인 타이머 화면(맨 위)으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 페이지 최초 로딩 시 설정 초기화 자동 실행
        applySettings();

        // 타이머 작동 로직
        function startTimer() {
            clearInterval(countdown);
            
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            timeLeft = (minutes * 60) + seconds;

            if (timeLeft <= 0) {
                alert("아래쪽 설정에서 올바른 시간을 지정해주세요!");
                return;
            }

            const timerDisplay = document.getElementById('timer');

            function updateTimer() {
                let currentMin = Math.floor(timeLeft / 60);
                let currentSec = timeLeft % 60;

                currentMin = currentMin < 10 ? '0' + currentMin : currentMin;
                currentSec = currentSec < 10 ? '0' + currentSec : currentSec;

                timerDisplay.textContent = `${currentMin}:${currentSec}`;

                if (timeLeft > 60) {
                    timerDisplay.className = 'green';
                } else if (timeLeft <= 60 && timeLeft > 10) {
                    timerDisplay.className = 'yellow';
                } else if (timeLeft <= 10 && timeLeft > 0) {
                    timerDisplay.className = 'red-blink';
                } else if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.className = 'red-blink';
                    alert("시간이 다 되었습니다!");
                    return;
                }

                timeLeft--;
            }

            updateTimer();
            countdown = setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
