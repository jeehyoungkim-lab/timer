<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운트다운 타이머</title>
    <style>
        /* 1. 전체 화면 정중앙 배치 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 중앙 정렬을 위한 컨테이너 */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* 2. 타이머 위 큰 제목 스타일 */
        #title-display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 4.5rem; /* 글씨가 없을 때도 공간 유지 */
            color: #e0e0e0;
            word-break: break-all;
        }

        /* 타이머 숫자 스타일 */
        #timer {
            font-size: 10rem;
            font-weight: bold;
            transition: color 0.5s ease;
            line-height: 1;
            margin-bottom: 40px;
        }

        /* 3. 하단 설정 영역 스타일 (고정 위치) */
        .controls-container {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        /* 입력창 및 버튼 공통 스타일 */
        input, button {
            padding: 12px 18px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        input[type="text"] {
            width: 250px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
        }

        input[type="number"] {
            width: 90px;
            text-align: center;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
        }

        button {
            cursor: pointer;
            background-color: #2ECC71;
            color: white;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* [상태별 색상 및 애니메이션] */
        .green { color: #2ECC71; }
        .yellow { color: #F1C40F; }
        .red-blink {
            color: #E74C3C;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <!-- 중앙 타이머 및 제목 표시 영역 -->
    <div class="main-container">
        <div id="title-display">타이머 제목을 입력하세요</div>
        <div id="timer" class="green">00:00</div>
    </div>

    <!-- 하단 글씨 및 시간 입력 설정 영역 -->
    <div class="controls-container">
        <!-- 제목 입력 창 -->
        <input type="text" id="titleInput" placeholder="여기에 타이머 제목 입력..." oninput="updateTitle(this.value)">
        
        <!-- 시간 설정 및 시작 버튼 -->
        <div class="input-group">
            <input type="number" id="minutesInput" placeholder="분" min="0" value="2">
            <input type="number" id="secondsInput" placeholder="초" min="0" max="59" value="0">
            <button onclick="startTimer()">시작</button>
        </div>
    </div>

    <script>
        let countdown;
        let timeLeft;

        // 아래쪽 입력창의 글씨를 실시간으로 위쪽 대형 제목에 반영하는 함수
        function updateTitle(text) {
            const titleDisplay = document.getElementById('title-display');
            if (text.trim() === "") {
                titleDisplay.textContent = "타이머 제목을 입력하세요";
            } else {
                titleDisplay.textContent = text;
            }
        }

        function startTimer() {
            clearInterval(countdown);
            
            // 분과 초를 각각 지정받아 합산
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            timeLeft = (minutes * 60) + seconds;

            if (timeLeft <= 0) {
                alert("올바른 시간을 입력해주세요!");
                return;
            }

            const timerDisplay = document.getElementById('timer');

            function updateTimer() {
                let currentMin = Math.floor(timeLeft / 60);
                let currentSec = timeLeft % 60;

                currentMin = currentMin < 10 ? '0' + currentMin : currentMin;
                currentSec = currentSec < 10 ? '0' + currentSec : currentSec;

                timerDisplay.textContent = `${currentMin}:${currentSec}`;

                // 조건별 색상 및 깜박임 스위칭
                if (timeLeft > 60) {
                    timerDisplay.className = 'green';
                } else if (timeLeft <= 60 && timeLeft > 10) {
                    timerDisplay.className = 'yellow';
                } else if (timeLeft <= 10 && timeLeft > 0) {
                    timerDisplay.className = 'red-blink';
                } else if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.className = 'red-blink';
                    alert("시간이 다 되었습니다!");
                    return;
                }

                timeLeft--;
            }

            updateTimer();
            countdown = setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
