<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운트다운 타이머</title>
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* 1. 첫 번째 섹션: 오직 타이머와 제목만 꽉 차게 표시 (스크롤 전) */
        .timer-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 높이를 100% 꽉 채움 */
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
        }

        /* 타이머 위 큰 제목 스타일 (크기는 js로 동적 조절) */
        #title-display {
            font-size: 3rem; /* 기본값 */
            font-weight: bold;
            margin-bottom: 20px;
            color: #e0e0e0;
            word-break: break-all;
            max-width: 90vw;
            line-height: 1.2;
        }

        /* 타이머 숫자 스타일 */
        #timer {
            font-size: 12rem;
            font-weight: bold;
            transition: color 0.5s ease;
            line-height: 1;
        }

        /* 2. 두 번째 섹션: 아래로 스크롤 해야 보이는 설정 영역 */
        .settings-screen {
            min-height: 50vh;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            gap: 25px;
            box-sizing: border-box;
        }

        /* 설정 박스 레이아웃 */
        .setting-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .setting-box label {
            font-size: 1rem;
            color: #aaa;
            font-weight: bold;
        }

        /* 입력창 및 슬라이더 스타일 */
        input[type="text"], input[type="number"] {
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #252525;
            color: #fff;
            outline: none;
        }

        /* 크기 조절 슬라이더(Range) 레이아웃 */
        .size-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }
        .size-value {
            font-size: 1.1rem;
            min-width: 50px;
            text-align: right;
        }

        /* 시간 입력 레이아웃 */
        .time-inputs {
            display: flex;
            gap: 10px;
        }
        .time-inputs input {
            width: 50%;
            text-align: center;
        }

        /* 시작 버튼 */
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background-color: #2ECC71;
            color: white;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }

        /* 안내 문구 */
        .scroll-hint {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* 상태별 색상 및 애니메이션 */
        .green { color: #2ECC71; }
        .yellow { color: #F1C40F; }
        .red-blink {
            color: #E74C3C;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>

    <!-- [1번 세션] 메인 타이머 화면 (접속 시 전체 화면으로 꽉 참) -->
    <div class="timer-screen">
        <div id="title-display">타이머 제목을 입력하세요</div>
        <div id="timer" class="green">00:00</div>
        
        <!-- 아래로 스크롤 하라는 힌트 문구 -->
        <div class="scroll-hint">▼ 설정을 하려면 아래로 스크롤 하세요</div>
    </div>

    <!-- [2번 세션] 하단 설정 영역 (스크롤해서 내려야 보임) -->
    <div class="settings-screen">
        
        <!-- 제목 입력 -->
        <div class="setting-box">
            <label for="titleInput">타이머 제목</label>
            <input type="text" id="titleInput" placeholder="여기에 타이머 제목 입력..." oninput="updateTitle(this.value)">
        </div>

        <!-- 제목 글자 크기 지정 (슬라이더) -->
        <div class="setting-box">
            <label for="sizeInput">제목 글자 크기</label>
            <div class="size-control">
                <input type="range" id="sizeInput" min="1.5" max="7" step="0.1" value="3" oninput="updateFontSize(this.value)">
                <span class="size-value" id="sizeValue">3.0 rem</span>
            </div>
        </div>
        
        <!-- 시간 지정 -->
        <div class="setting-box">
            <label>시간 설정</label>
            <div class="time-inputs">
                <input type="number" id="minutesInput" placeholder="분" min="0" value="2">
                <input type="number" id="secondsInput" placeholder="초" min="0" max="59" value="0">
            </div>
        </div>

        <!-- 시작 버튼 -->
        <button onclick="startTimer()">타이머 시작</button>

    </div>

    <script>
        let countdown;
        let timeLeft;

        // 실시간 제목 업데이트
        function updateTitle(text) {
            const titleDisplay = document.getElementById('title-display');
            if (text.trim() === "") {
                titleDisplay.textContent = "타이머 제목을 입력하세요";
            } else {
                titleDisplay.textContent = text;
            }
        }

        // 실시간 제목 크기 업데이트
        function updateFontSize(value) {
            document.getElementById('title-display').style.fontSize = `${value}rem`;
            document.getElementById('sizeValue').textContent = `${parseFloat(value).toFixed(1)} rem`;
        }

        // 타이머 작동 로직
        function startTimer() {
            clearInterval(countdown);
            
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            timeLeft = (minutes * 60) + seconds;

            if (timeLeft <= 0) {
                alert("올바른 시간을 입력해주세요!");
                return;
            }

            // 시작 버튼 누르면 자동으로 타이머 화면(맨 위)으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const timerDisplay = document.getElementById('timer');

            function updateTimer() {
                let currentMin = Math.floor(timeLeft / 60);
                let currentSec = timeLeft % 60;

                currentMin = currentMin < 10 ? '0' + currentMin : currentMin;
                currentSec = currentSec < 10 ? '0' + currentSec : currentSec;

                timerDisplay.textContent = `${currentMin}:${currentSec}`;

                if (timeLeft > 60) {
                    timerDisplay.className = 'green';
                } else if (timeLeft <= 60 && timeLeft > 10) {
                    timerDisplay.className = 'yellow';
                } else if (timeLeft <= 10 && timeLeft > 0) {
                    timerDisplay.className = 'red-blink';
                } else if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.className = 'red-blink';
                    alert("시간이 다 되었습니다!");
                    return;
                }

                timeLeft--;
            }

            updateTimer();
            countdown = setInterval(updateTimer, 1000);
        }
    </script>
</body>
</html>
